<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>StarCam</title>
  <style>
    :root {
      --bg: #0a0c14; --surface: #12152a; --surface2: #1a1f38;
      --accent: #4a7fff; --accent2: #7b4fff;
      --text: #dde2ff; --dim: #5a6080;
      --ok: #3ddc84; --warn: #ffb347; --err: #ff4d6d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; display: flex; flex-direction: column; }

    /* ── Header ── */
    header { background: var(--surface); padding: 7px 12px 0; flex-shrink: 0; border-bottom: 1px solid rgba(255,255,255,.04); }
    .hdr-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; }
    .logo { font-size: 14px; font-weight: 700; letter-spacing: 3px; }
    .ph-count { font-size: 11px; color: var(--dim); }
    .chips { display: flex; gap: 5px; flex-wrap: wrap; padding-bottom: 7px; }
    .chip { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; padding: 2px 7px; border-radius: 20px; background: var(--surface2); color: var(--dim); white-space: nowrap; }
    .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--dim); flex-shrink: 0; }
    .chip.ok   .dot { background: var(--ok); }
    .chip.warn .dot { background: var(--warn); }
    .chip.err  .dot { background: var(--err); }
    .chip.gps-fix  .dot { background: var(--ok); }
    .chip.gps-conn .dot { background: var(--warn); }

    /* ── Tabs ── */
    .tabs { display: flex; background: var(--surface); flex-shrink: 0; border-bottom: 1px solid rgba(255,255,255,.04); }
    .tab { flex: 1; padding: 8px; text-align: center; font-size: 13px; color: var(--dim); cursor: pointer; border-bottom: 2px solid transparent; transition: color .15s, border-color .15s; }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* ── Panel container ── */
    .panels { flex: 1; position: relative; overflow: hidden; }
    .panel { display: none; position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; }
    #panel-capture.active { display: flex; flex-direction: column; }
    #panel-gallery.active { display: block; padding: 10px; }

    /* ── Preview: full width, ~25vh tall ── */
    .preview-wrap {
      width: 100%; height: 25vh; min-height: 120px; max-height: 220px;
      background: #000; flex-shrink: 0; position: relative; overflow: hidden;
    }
    .preview-wrap img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .p-overlay {
      position: absolute; inset: 0; display: none;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,.75); font-size: 14px; color: var(--text);
    }
    .p-overlay.show { display: flex; }

    /* ── Settings (compact single-line rows) ── */
    .settings { padding: 8px 12px; display: flex; flex-direction: column; gap: 7px; flex-shrink: 0; }

    .row { display: flex; align-items: center; gap: 7px; height: 34px; }
    .lbl { font-size: 11px; color: var(--dim); width: 52px; flex-shrink: 0; }

    input[type=range] {
      flex: 1; -webkit-appearance: none; appearance: none; min-width: 0;
      background: var(--surface2); height: 5px; border-radius: 3px; outline: none; cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 22px; height: 22px;
      border-radius: 50%; background: var(--accent); cursor: pointer;
      box-shadow: 0 0 5px rgba(74,127,255,.5);
    }

    .num-wrap { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
    .num-in {
      width: 60px; background: var(--surface2); color: var(--accent);
      border: 1px solid transparent; border-radius: 6px;
      padding: 4px 5px; font-size: 13px; font-weight: 600; text-align: right;
      -moz-appearance: textfield;
    }
    .num-in:focus { outline: none; border-color: var(--accent); background: #1e2440; }
    .num-in::-webkit-outer-spin-button,
    .num-in::-webkit-inner-spin-button { -webkit-appearance: none; }
    .unit { font-size: 11px; color: var(--dim); }

    select.awb {
      flex: 1; background: var(--surface2); color: var(--text);
      border: 1px solid transparent; padding: 5px 8px; border-radius: 6px;
      font-size: 13px; cursor: pointer;
    }
    select.awb:focus { outline: none; border-color: var(--accent); }

    /* ── Progress ── */
    .progress { height: 3px; background: var(--surface2); flex-shrink: 0; overflow: hidden; display: none; }
    .progress.show { display: block; }
    .pfill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); width: 0; transition: width .4s; }

    /* ── Capture button ── */
    .capture-btn {
      margin: 8px 12px 10px; padding: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff; border: none; border-radius: 12px;
      font-size: 15px; font-weight: 700; letter-spacing: 2px;
      cursor: pointer; flex-shrink: 0; transition: opacity .15s;
    }
    .capture-btn:active { opacity: .8; }
    .capture-btn:disabled { opacity: .4; cursor: not-allowed; }

    /* ── Gallery ── */
    .gallery-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .g-item { position: relative; aspect-ratio: 4/3; background: var(--surface); border-radius: 8px; overflow: hidden; cursor: pointer; }
    .g-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .g-info { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,.65); padding: 3px 6px; font-size: 10px; color: var(--dim); }
    .gps-badge { position: absolute; top: 5px; right: 5px; background: rgba(61,220,132,.85); color: #000; font-size: 9px; font-weight: 700; padding: 2px 5px; border-radius: 4px; }
    .empty { color: var(--dim); font-size: 13px; padding: 24px; text-align: center; }

    /* ── Modal ── */
    .modal { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.97); flex-direction: column; }
    .modal.open { display: flex; }
    .modal-hdr { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; flex-shrink: 0; }
    .modal-fname { font-size: 12px; color: var(--dim); word-break: break-all; flex: 1; margin-right: 8px; }
    .modal-close { background: none; border: none; color: var(--text); font-size: 26px; line-height: 1; cursor: pointer; }
    .modal-img { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .modal-img img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .modal-meta {
      padding: 10px 14px; background: var(--surface);
      font-size: 11px; color: var(--dim); flex-shrink: 0;
      display: none; line-height: 1.7;
    }
    .modal-meta.show { display: block; }
    .meta-row { display: flex; gap: 6px; }
    .meta-key { color: var(--dim); width: 52px; flex-shrink: 0; }
    .meta-val { color: var(--text); }
    .modal-actions { display: flex; gap: 8px; padding: 12px 16px; flex-shrink: 0; }
    .btn { flex: 1; padding: 13px; border: none; border-radius: 9px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .btn-dl  { background: var(--accent); color: #fff; }
    .btn-del { background: var(--err);    color: #fff; }

    /* ── Toast ── */
    .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: var(--surface2); color: var(--text); padding: 10px 22px; border-radius: 22px; font-size: 13px; z-index: 200; opacity: 0; transition: opacity .3s; white-space: nowrap; pointer-events: none; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

<header>
  <div class="hdr-top">
    <span class="logo">★ STARCAM</span>
    <span class="ph-count" id="ph-count"></span>
  </div>
  <div class="chips">
    <span class="chip" id="chip-cam"><span class="dot"></span><span id="lbl-cam">카메라</span></span>
    <span class="chip gps-none" id="chip-gps"><span class="dot"></span><span id="lbl-gps">GPS 없음</span></span>
    <span class="chip" id="chip-temp"><span class="dot"></span><span id="lbl-temp">--°C</span></span>
    <span class="chip" id="chip-disk"><span class="dot"></span><span id="lbl-disk">디스크</span></span>
  </div>
</header>

<div class="tabs">
  <div class="tab active" id="tab-btn-capture" onclick="switchTab('capture')">촬영</div>
  <div class="tab" id="tab-btn-gallery" onclick="switchTab('gallery')">갤러리</div>
</div>

<div class="panels">

  <!-- ── 촬영 탭 ── -->
  <div class="panel active" id="panel-capture">

    <!-- 미리보기: 전체 너비, 약 25vh -->
    <div class="preview-wrap">
      <img id="preview" src="/stream" alt="" onerror="handleStreamErr()">
      <div class="p-overlay" id="p-overlay"></div>
    </div>

    <!-- 파라미터 -->
    <div class="settings">

      <!-- 노출 (로그 스케일) -->
      <div class="row">
        <span class="lbl">노출</span>
        <input type="range" id="sl-shutter" min="0" max="1000" step="1" value="582"
               oninput="onShutterSlider(this.value)">
        <div class="num-wrap">
          <input type="number" class="num-in" id="in-shutter" value="2000"
                 min="1" max="120000" inputmode="numeric" oninput="onShutterInput(this.value)">
          <span class="unit">ms</span>
        </div>
      </div>

      <!-- 게인 -->
      <div class="row">
        <span class="lbl">게인</span>
        <input type="range" id="sl-gain" min="1" max="16" step="0.5" value="1"
               oninput="syncInput('gain', this.value)">
        <input type="number" class="num-in" id="in-gain" value="1"
               min="1" max="16" step="0.5" inputmode="decimal"
               oninput="syncSlider('gain', this.value, 1, 16)">
      </div>

      <!-- AWB -->
      <div class="row">
        <span class="lbl">WB</span>
        <select class="awb" id="s-awb">
          <option value="auto">자동</option>
          <option value="incandescent">백열등</option>
          <option value="tungsten">텅스텐</option>
          <option value="fluorescent">형광등</option>
          <option value="indoor">실내</option>
          <option value="daylight">주광</option>
          <option value="cloudy">흐림</option>
        </select>
      </div>

      <!-- 연속 장수 -->
      <div class="row">
        <span class="lbl">장수</span>
        <input type="range" id="sl-count" min="1" max="20" step="1" value="1"
               oninput="syncInput('count', this.value)">
        <div class="num-wrap">
          <input type="number" class="num-in" id="in-count" value="1"
                 min="1" max="20" step="1" inputmode="numeric"
                 oninput="syncSlider('count', this.value, 1, 20)">
          <span class="unit">장</span>
        </div>
      </div>

      <!-- 간격 -->
      <div class="row">
        <span class="lbl">간격</span>
        <input type="range" id="sl-interval" min="1" max="60" step="1" value="3"
               oninput="syncInput('interval', this.value)">
        <div class="num-wrap">
          <input type="number" class="num-in" id="in-interval" value="3"
                 min="1" max="60" step="1" inputmode="numeric"
                 oninput="syncSlider('interval', this.value, 1, 60)">
          <span class="unit">s</span>
        </div>
      </div>

    </div><!-- /settings -->

    <div class="progress" id="progress"><div class="pfill" id="pfill"></div></div>

    <button class="capture-btn" id="capture-btn" onclick="doCapture()">★ 촬영</button>

  </div><!-- /panel-capture -->

  <!-- ── 갤러리 탭 ── -->
  <div class="panel" id="panel-gallery">
    <div class="gallery-grid" id="gallery-grid"></div>
  </div>

</div>

<!-- 전체화면 모달 -->
<div class="modal" id="modal">
  <div class="modal-hdr">
    <span class="modal-fname" id="modal-fname"></span>
    <button class="modal-close" onclick="closeModal()">✕</button>
  </div>
  <div class="modal-img"><img id="modal-img" src="" alt=""></div>
  <div class="modal-meta" id="modal-meta"></div>
  <div class="modal-actions">
    <button class="btn btn-dl"  onclick="downloadPhoto()">다운로드</button>
    <button class="btn btn-del" onclick="deletePhoto()">삭제</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  /* ─── Shutter: log scale (slider 0–1000 → 1ms–120000ms) ─── */
  const L0 = Math.log10(1), L1 = Math.log10(120000);
  const slToMs = v  => Math.round(Math.pow(10, L0 + (L1 - L0) * v / 1000));
  const msToSl = ms => Math.round((Math.log10(Math.max(1, ms)) - L0) / (L1 - L0) * 1000);

  function onShutterSlider(v) { document.getElementById('in-shutter').value = slToMs(+v); }
  function onShutterInput(v)  { document.getElementById('sl-shutter').value = msToSl(Math.max(1, Math.min(120000, +v || 1))); }

  /* ─── Linear sync ── */
  function syncInput(key, v)          { document.getElementById('in-' + key).value = v; }
  function syncSlider(key, v, mn, mx) { document.getElementById('sl-' + key).value = Math.max(mn, Math.min(mx, +v || mn)); }

  /* ─── Tab ── */
  function switchTab(name) {
    ['capture','gallery'].forEach(n => {
      document.getElementById('tab-btn-' + n).classList.toggle('active', n === name);
      document.getElementById('panel-' + n).classList.toggle('active', n === name);
    });
    if (name === 'gallery') loadGallery();
  }

  function handleStreamErr() {
    setTimeout(() => { document.getElementById('preview').src = '/stream?' + Date.now(); }, 3000);
  }

  /* ─── Status ── */
  async function fetchStatus() {
    try {
      const s = await fetch('/api/status').then(r => r.json());

      setChip('chip-cam', s.camera_connected ? 'ok' : 'err',
              s.camera_connected ? '카메라 연결됨' : '카메라 없음');

      let gCls = '', gTxt = 'GPS 없음';
      if (s.gps_fix) {
        gCls = 'gps-fix';
        gTxt = `GPS ${s.latitude?.toFixed(4)}, ${s.longitude?.toFixed(4)}` +
               (s.satellites ? ` (${s.satellites}개)` : '');
      } else if (s.gps_connected) { gCls = 'gps-conn'; gTxt = 'GPS 탐색중'; }
      const gc = document.getElementById('chip-gps');
      gc.className = 'chip ' + gCls;
      document.getElementById('lbl-gps').textContent = gTxt;

      const t = s.cpu_temp;
      setChip('chip-temp', t > 70 ? 'err' : t > 60 ? 'warn' : 'ok',
              t != null ? t.toFixed(1) + '°C' : '--°C');
      setChip('chip-disk', s.disk_percent > 90 ? 'err' : s.disk_percent > 75 ? 'warn' : 'ok',
              (s.disk_free || '--') + ' 여유');
      document.getElementById('ph-count').textContent = `사진 ${s.photo_count || 0}장`;
    } catch (_) {}
  }

  function setChip(id, cls, txt) {
    const el = document.getElementById(id);
    el.className = 'chip ' + cls;
    el.querySelector('span:last-child').textContent = txt;
  }

  /* ─── Capture ── */
  let busy = false;

  async function doCapture() {
    if (busy) return;
    busy = true;
    const btn     = document.getElementById('capture-btn');
    const overlay = document.getElementById('p-overlay');
    const prog    = document.getElementById('progress');
    const fill    = document.getElementById('pfill');

    const shutterMs  = Math.max(1, +document.getElementById('in-shutter').value || 2000);
    const gain       = +document.getElementById('in-gain').value || 1;
    const awb        = document.getElementById('s-awb').value;
    const count      = Math.max(1, +document.getElementById('in-count').value || 1);
    const interval   = Math.max(1, +document.getElementById('in-interval').value || 3);
    const shutterSec = shutterMs / 1000;

    btn.disabled = true;
    overlay.textContent = `1 / ${count}`;
    overlay.classList.add('show');
    prog.classList.add('show');
    fill.style.width = '5%';

    const total = count * shutterSec + (count - 1) * interval;
    const t0 = Date.now();
    const tick = setInterval(() => {
      const el = (Date.now() - t0) / 1000;
      fill.style.width = Math.min(90, el / total * 100) + '%';
      overlay.textContent = Math.min(count, Math.floor(el / (shutterSec + interval)) + 1) + ' / ' + count;
    }, 500);

    try {
      const res  = await fetch('/api/capture', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ shutter: shutterMs, gain, awb, count, interval }),
      });
      clearInterval(tick);
      const d = await res.json();
      fill.style.width = '100%';
      if (d.saved && d.saved.length)
        showToast(`✓ ${d.saved.length}장 저장됨` + (d.gps_saved ? ' 📍' : ''));
      else
        showToast('촬영 실패: ' + (d.error || '알 수 없는 오류'), 5000);
    } catch (_) { clearInterval(tick); showToast('서버 연결 오류'); }
    finally {
      setTimeout(() => {
        overlay.classList.remove('show'); prog.classList.remove('show');
        fill.style.width = '0'; btn.disabled = false; busy = false;
      }, 800);
    }
  }

  /* ─── Gallery ── */
  async function loadGallery() {
    const grid = document.getElementById('gallery-grid');
    grid.innerHTML = '<div class="empty">불러오는 중...</div>';
    try {
      const photos = await fetch('/api/photos').then(r => r.json());
      if (!photos.length) { grid.innerHTML = '<div class="empty">사진 없음</div>'; return; }
      grid.innerHTML = '';
      photos.forEach(p => {
        const d = document.createElement('div');
        d.className = 'g-item';
        const lbl = p.filename.replace('star_','').replace(/\.jpg$/,'').replace(/_(\d{3})$/,' #$1');
        d.innerHTML =
          `<img src="/api/photos/${p.filename}/thumb" loading="lazy" onerror="this.src='/api/photos/${p.filename}'">` +
          (p.has_gps ? '<span class="gps-badge">GPS</span>' : '') +
          `<div class="g-info">${lbl}</div>`;
        d.onclick = () => openModal(p);
        grid.appendChild(d);
      });
    } catch (_) { grid.innerHTML = '<div class="empty" style="color:var(--err)">불러오기 실패</div>'; }
  }

  /* ─── Modal ── */
  let cur = null;

  function openModal(photo) {
    cur = photo;
    document.getElementById('modal-fname').textContent = photo.filename;
    document.getElementById('modal-img').src = '/api/photos/' + photo.filename;

    const meta  = photo.metadata || {};
    const cam   = meta.camera || {};
    const gps   = meta.gps;
    const metaDiv = document.getElementById('modal-meta');

    const rows = [];
    if (meta.captured_at) rows.push(['촬영일시', meta.captured_at.replace('T', ' ')]);
    if (cam.shutter_ms != null) {
      const s = cam.shutter_ms;
      rows.push(['노출', s >= 1000 ? (s/1000).toFixed(s%1000===0?0:2)+'s' : s+'ms']);
    }
    if (cam.gain     != null) rows.push(['게인',    cam.gain]);
    if (cam.awb)               rows.push(['WB',     cam.awb]);
    if (cam.total    > 1)      rows.push(['연속',   `${cam.sequence} / ${cam.total}  (간격 ${cam.interval_s}s)`]);
    if (gps && gps.fix) {
      rows.push(['위도',   gps.latitude?.toFixed(6)]);
      rows.push(['경도',   gps.longitude?.toFixed(6)]);
      if (gps.altitude  != null) rows.push(['고도',   gps.altitude.toFixed(1) + ' m']);
      if (gps.satellites)        rows.push(['위성',   gps.satellites + '개']);
      if (gps.timestamp)         rows.push(['GPS 시각', gps.timestamp]);
    }

    if (rows.length) {
      metaDiv.innerHTML = rows.map(([k,v]) =>
        `<div class="meta-row"><span class="meta-key">${k}</span><span class="meta-val">${v}</span></div>`
      ).join('');
      metaDiv.classList.add('show');
    } else {
      metaDiv.classList.remove('show');
    }
    document.getElementById('modal').classList.add('open');
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('open');
    document.getElementById('modal-img').src = '';
    cur = null;
  }

  function downloadPhoto() {
    if (!cur) return;
    const a = document.createElement('a');
    a.href = '/api/photos/' + cur.filename; a.download = cur.filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }

  async function deletePhoto() {
    if (!cur || !confirm(cur.filename + '\n\n삭제하시겠습니까?')) return;
    try {
      await fetch('/api/photos/' + cur.filename + '/delete', {method:'POST'});
      closeModal(); showToast('삭제됨'); loadGallery();
    } catch (_) { showToast('삭제 실패'); }
  }

  function showToast(msg, dur = 3000) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), dur);
  }

  fetchStatus();
  setInterval(fetchStatus, 4000);
</script>
</body>
</html>
